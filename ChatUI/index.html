<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes, interactive-widget=resizes-content">
  <title>ChatUI</title>
  <style>
    html, body, #standalone-chat-host { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <main id="standalone-chat-host"></main>
  <script type="module">
    import { mount } from './js/module.js';
    const host = document.getElementById('standalone-chat-host');
    const shell = {
      setTitle(title) { document.title = title || 'ChatUI'; },
      notifyAppearance() {},
      reportFatalError(error) {
        console.error('Standalone ChatUI failed:', error);
        host.textContent = `ChatUI could not start: ${error?.message || error}`;
        host.style.color = '#fff';
        host.style.padding = '24px';
      }
    };
    mount({
      host,
      route: { app: 'chat', type: 'chat-home', chatId: null },
      standalone: true,
      basePath: '/ChatUI',
      shell
    }).catch(shell.reportFatalError);
  </script>
</body>
</html>
