<aside class="right-sidebar collapsed" id="right-sidebar" aria-label="Control panel" aria-hidden="true" inert>
      <div class="right-sidebar-header">
        <span class="right-sidebar-title">Controls</span>
        <button class="icon-btn-sm" id="close-right-sidebar-btn" title="Close panel" aria-label="Close panel">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="right-sidebar-scrollable">
        <div class="right-sidebar-section">
          <div class="right-sidebar-section-title">AI TOOLS</div>

          <div class="sidebar-tool-card">
            <div class="sidebar-tool-info"><i data-lucide="search" class="tool-icon"></i><span class="tool-name">Google Search</span></div>
            <label class="toggle-switch"><input type="checkbox" id="sidebar-toggle-google-search" /><span class="toggle-slider"></span></label>
          </div>

          <div class="sidebar-tool-card">
            <div class="sidebar-tool-info"><i data-lucide="link" class="tool-icon"></i><span class="tool-name">URL Context</span></div>
            <label class="toggle-switch"><input type="checkbox" id="sidebar-toggle-url-context" /><span class="toggle-slider"></span></label>
          </div>

          <div class="sidebar-tool-card">
            <div class="sidebar-tool-info"><i data-lucide="code-2" class="tool-icon"></i><span class="tool-name">Code Execution</span></div>
            <label class="toggle-switch"><input type="checkbox" id="sidebar-toggle-code-execution" /><span class="toggle-slider"></span></label>
          </div>

          <div class="sidebar-tool-card" title="Allow the AI to work with your Workspace files.">
            <div class="sidebar-tool-info"><i data-lucide="folder-tree" class="tool-icon"></i><span class="tool-name">Workspace Access</span></div>
            <label class="toggle-switch"><input type="checkbox" id="sidebar-toggle-workspace" aria-label="Workspace Access" title="Allow the AI to work with your Workspace files." /><span class="toggle-slider"></span></label>
          </div>

          <div class="sidebar-tool-card" data-tool="todo">
            <div class="sidebar-tool-info"><i data-lucide="list-todo" class="tool-icon"></i><span class="tool-name">To-Do</span></div>
            <label class="toggle-switch"><input type="checkbox" id="sidebar-toggle-todo" /><span class="toggle-slider"></span></label>
          </div>
        </div>

        <div class="right-sidebar-section">
          <div class="right-sidebar-section-title">CHAT ACTIONS</div>
          <button class="sidebar-action-btn" id="right-sidebar-clear-chat-btn"><i data-lucide="eraser"></i><span>Clear Messages</span></button>
          <button class="sidebar-action-btn" id="right-sidebar-export-chat-btn"><i data-lucide="download"></i><span>Export Chat</span></button>
          <button class="sidebar-action-btn danger" id="right-sidebar-delete-chat-btn"><i data-lucide="trash-2"></i><span>Delete Chat</span></button>
        </div>
      </div>
    </aside>
