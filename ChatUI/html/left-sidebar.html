        <div class="sidebar-header-actions">
          <button class="icon-btn" id="open-search-btn" title="Search chats">
            <i data-lucide="search"></i>
          </button>
          <button class="icon-btn" id="toggle-sidebar-btn" title="Close sidebar">
            <i data-lucide="panel-left-close"></i>
          </button>
        </div>
      </div>

      <!-- Quick Navigation -->
      <div class="sidebar-nav">
        <a class="new-chat-btn" id="new-chat-btn" href="/" title="New chat" aria-label="New chat">
          <i data-lucide="square-pen"></i>
          <span>New Chat</span>
        </a>
        <a class="workspace-nav-btn" id="workspace-nav-btn" href="/workspace" title="Open Workspace" aria-label="Open Workspace">
          <i data-lucide="folder-tree"></i>
          <span>Workspace</span>
        </a>
      </div>

      <!-- Scrollable Sidebar Sections -->
      <div class="sidebar-scrollable">

        <!-- Pinned Chats Section -->
        <div class="sidebar-section" id="pinned-section">
          <div class="section-title">Pinned</div>
          <ul class="chat-list" id="pinned-chat-list">
            <li class="empty-section-text" id="empty-pinned-msg">No pinned chats</li>
          </ul>
        </div>

        <!-- Projects Section -->
        <div class="sidebar-section" id="projects-section">
          <div class="section-header">
            <span class="section-title">Projects</span>
            <button class="icon-btn-sm" id="create-project-trigger" title="Create Project">
              <i data-lucide="plus"></i>
            </button>
          </div>
          <ul class="project-list" id="project-list">
            <li class="empty-section-text" id="empty-project-msg">No projects yet</li>
          </ul>
        </div>

        <!-- Recent Chats Section -->
        <div class="sidebar-section" id="chats-section">
          <div class="section-header">
            <span class="section-title">Chats</span>
            <button class="icon-btn-sm" id="create-chat-trigger" title="New chat" aria-label="New chat">
              <i data-lucide="plus"></i>
            </button>
          </div>
          <ul class="chat-list" id="recent-chat-list">
            <li class="empty-section-text" id="empty-chats-msg">Your chat history will appear here</li>
          </ul>
        </div>

      </div>

      <!-- Settings Footer -->
      <div class="sidebar-footer">
        <div class="user-profile" id="open-settings-trigger" role="button" tabindex="0" aria-label="Open settings">
          <div class="user-avatar">MA</div>
          <div class="user-info">
            <div class="user-name">ChatUI</div>
            <div class="user-plan">Settings</div>
          </div>
        </div>
      </div>

    </aside>
