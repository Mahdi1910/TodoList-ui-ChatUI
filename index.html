<!DOCTYPE html>
<html lang="en" data-shell-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>To-Do</title>
  <link rel="stylesheet" href="/shell/css/shell.css" />
</head>
<body>
  <div class="shell" id="app-shell">
    <nav class="shell-nav" aria-label="Applications">
      <div class="shell-nav-main">
        <button class="shell-nav-item" id="shell-nav-todo" type="button" data-shell-app="todo" aria-label="To-Do List" title="To-Do List">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="shell-nav-label">To-Do</span>
        </button>
        <button class="shell-nav-item" id="shell-nav-chat" type="button" data-shell-app="chat" aria-label="ChatUI" title="ChatUI">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a10.7 10.7 0 01-4.4-.92L3 20l1.3-3.48A7.36 7.36 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
          <span class="shell-nav-label">AI</span>
          <span class="shell-nav-status" id="shell-chat-status" aria-hidden="true"></span>
        </button>
        <button class="shell-nav-item" type="button" disabled aria-label="Habit Tracker — planned" title="Habit Tracker — planned">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span class="shell-nav-label">Habit</span>
        </button>
        <button class="shell-nav-item" type="button" disabled aria-label="Diary — planned" title="Diary — planned">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          <span class="shell-nav-label">Diary</span>
        </button>
      </div>
      <div class="shell-nav-footer">
        <button class="shell-nav-item" id="shell-open-settings" type="button" aria-label="Open To-Do settings" title="Settings" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="shell-nav-label">Settings</span>
        </button>
      </div>
    </nav>

    <main class="shell-stage" id="shell-stage">
      <section class="app-panel" id="todo-frame-panel" data-shell-panel="todo" data-frame-state="not-created" aria-hidden="false">
        <iframe id="todo-frame" title="To-Do List" tabindex="0"></iframe>
        <div class="frame-state" aria-live="polite">
          <div class="frame-state-card frame-loading-card">Loading To-Do…</div>
          <div class="frame-state-card frame-error-card">
            <strong>To-Do could not start.</strong>
            <span class="frame-error-detail"></span>
            <button type="button" data-frame-retry="todo">Retry To-Do</button>
          </div>
        </div>
      </section>

      <section class="app-panel" id="chat-frame-panel" data-shell-panel="chat" data-frame-state="not-created" aria-hidden="true" inert>
        <iframe
          id="chat-frame"
          title="ChatUI"
          tabindex="-1"
          allow="microphone; autoplay; clipboard-read; clipboard-write; fullscreen"
          allowfullscreen>
        </iframe>
        <div class="frame-state" aria-live="polite">
          <div class="frame-state-card frame-loading-card">Loading ChatUI…</div>
          <div class="frame-state-card frame-error-card">
            <strong>ChatUI could not start.</strong>
            <span class="frame-error-detail"></span>
            <button type="button" data-frame-retry="chat">Retry ChatUI</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="shell-toast" id="shell-toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/shell/js/app-shell.js"></script>
</body>
</html>
