name: Verify AAC Remux Once

on:
  push:
    branches:
      - feature/gemini-aac-voice-recording
    paths:
      - aac-remux.verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/gemini-aac-voice-recording

      - name: Parse changed JavaScript as ESM
        shell: bash
        run: |
          node --input-type=module --check < ChatUI/js/composer/aac-remuxer.js
          node --input-type=module --check < ChatUI/js/composer/recorder.js

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate AAC-LC MP4 fixture
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i 'sine=frequency=880:sample_rate=48000:duration=1.25' \
            -c:a aac -profile:a aac_low -b:a 96k \
            -movflags +faststart \
            /tmp/source.m4a

      - name: Remux fixture to ADTS AAC
        shell: bash
        run: |
          node --experimental-default-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { remuxMp4AacToAdts } from './ChatUI/js/composer/aac-remuxer.js';

          const input = await readFile('/tmp/source.m4a');
          const output = await remuxMp4AacToAdts(new Blob([input], { type: 'audio/mp4' }));
          if (output.type !== 'audio/aac') throw new Error(`Unexpected output MIME: ${output.type}`);
          const bytes = new Uint8Array(await output.arrayBuffer());
          if (bytes.length < 8) throw new Error('AAC output is unexpectedly empty.');
          if (bytes[0] !== 0xff || (bytes[1] & 0xf0) !== 0xf0) {
            throw new Error('AAC output does not begin with an ADTS sync word.');
          }
          if (bytes.length >= 8 && String.fromCharCode(...bytes.slice(4, 8)) === 'ftyp') {
            throw new Error('Output is still an MP4 container renamed as AAC.');
          }
          await writeFile('/tmp/output.aac', bytes);
          console.log(`Remuxed ${input.byteLength} MP4 bytes to ${bytes.byteLength} ADTS AAC bytes.`);
          NODE

      - name: Probe AAC output
        shell: bash
        run: |
          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/output.aac)"
          sample_rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 /tmp/output.aac)"
          channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 /tmp/output.aac)"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/output.aac)"
          test "$codec" = "aac"
          test "$sample_rate" = "48000"
          test "$channels" -ge 1
          awk -v d="$duration" 'BEGIN { exit !(d > 1.0) }'
          echo "AAC probe: codec=$codec sample_rate=$sample_rate channels=$channels duration=$duration"

      - name: Verify combined integration and build
        shell: bash
        run: |
          node scripts/verify-integration.mjs
          node scripts/build-static.mjs
          test -f dist/ChatUI/js/composer/aac-remuxer.js
          test -f dist/ChatUI/js/vendor/mp4box/mp4box.all.mjs
          test -f dist/ChatUI/js/vendor/mp4box/LICENSE

      - name: Verify standalone ChatUI build
        shell: bash
        run: |
          cd ChatUI
          node scripts/build-static.mjs
          test -f dist/js/composer/aac-remuxer.js
          test -f dist/js/vendor/mp4box/mp4box.all.mjs
          test -f dist/js/vendor/mp4box/LICENSE
